<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio Tycho Kerkhofs</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600;700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans+JP:wght@100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/style/style.css">

    <!-- <link rel="shortcut icon" href="../imgs/favicon.ico"> -->

    <script src="/js/jquery-3.7.1.min.js"></script>
    <script type="text/javascript" src="/js/script.js"></script>
</head>

<body class="project-page" onload="documentReady(true)">
    <!-- Navigation -->
    <header class="dark-section" id="navigation-header"></header>

    <!-- Main -->
    <main data-project-id="moviePoster">
        <!-- Project Thumbnail -->
        <figure class="project-details-thumbnail">
            <img id="project-thumbnail">
        </figure>

        <!-- Project details container -->
        <section class="project-details-content">
            <div class="project-details-content-inner">

                <!-- Project header details -->
                <header class="project-details-head">
                    <h1 id="project-title"></h1>

                    <!-- <p id="project-year"></p> -->
                    
                     <p>
                        For the subject “Imagery” we had to make a movie poster with ourselves as the main subject in Photoshop.
                    </p>
                    <p>
                        I got my inspiration from a game called “Horizon Zero Dawn” and from a movie called “Tron”.
                    </p>
                    
                    <div class="project-tags"></div>
                </header>

                <!-- Project body details -->
                <section class="project-details-body">
                    
                    <!-- <p>For this project I was in charge of designing and creating most of the UI.</p> -->
                    <div class="project-gallery column-count-1">
                        <figure>
                            <img src="/imgs/projects/moviePoster/movie_poster.png" alt="movie poster">
                        </figure>
                    </div>
                </section>

            </div>
        </section>

        <p class="copyright">Copyright &copy; Tycho Kerkhofs. All rights reserved.</p>
    </main>

    <!-- Footer -->
    <footer id="main-footer"></footer>
    
    <script src="/js/components.js"></script>
</body>

</html>
