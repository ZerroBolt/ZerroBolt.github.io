<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio Tycho Kerkhofs</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600;700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans+JP:wght@100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../style/style.css">

    <!-- <link rel="shortcut icon" href="../imgs/favicon.ico"> -->

    <script src="../js/jquery-3.7.1.min.js"></script>
    <script type="text/javascript" src="../js/script.js"></script>
</head>

<body class="project-page" onload="documentReady(true)">
    <!-- Navigation -->
    <header class="dark-section" id="navigation-header"></header>

    <!-- Main -->
    <main data-project-id="energybuddy">
        <figure class="project-details-thumbnail">
            <img src="../imgs/projects/test.jpg" alt="project thumbnail">
        </figure>

        <section class="project-details-content">
            <div class="project-details-content-inner">

                <header>
                    <h2 id="project-title"></h2>

                    <p id="project-year"></p>
                </header>

                <div class="project-tags"></div>

                <hr>

                <p id="project-description"></p>
                
                <div class="project-images-container">
                    <div class="project-images-container-inner"></div>
                </div>
            </div>
        </section>

        <p id="copyright">Copyright &copy; Tycho Kerkhofs. All rights reserved.</p>
    </main>

    <!-- Footer -->
    <footer id="main-footer"></footer>
    
    <script src="../js/components.js"></script>
</body>

</html>
